<!DOCTYPE html>
<html>
<head><title>IREPS - Login</title></head>
<body>
<div class="header">Indian Railways E-Procurement System</div>
<form action="/epsn/login.do" method="post">
  <table>
    <tr><td>User Id</td><td><input type="text" name="userId"></td></tr>
    <tr><td>Password</td><td><input type="password" name="password"></td></tr>
    <tr><td colspan="2">Login using Digital Signature Certificate / Security Key</td></tr>
    <tr><td colspan="2"><input type="submit" value="Login"></td></tr>
  </table>
</form>
</body>
</html>
